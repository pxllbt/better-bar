name: "Feature Request"
description: "Suggest an idea for Better Bar"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Let me know.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Is this about a limitation or frustration you hit?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you want
      description: Describe the feature.
      placeholder: "Add an option to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other approaches you looked at.
      placeholder: "Built a custom surface, considered..."

  - type: textarea
    id: performance_impact
    attributes:
      label: Idle CPU impact
      description: Better Bar is built for near-zero idle CPU. How does this feature affect that?
      placeholder: "Zero idle CPU — event listeners only."