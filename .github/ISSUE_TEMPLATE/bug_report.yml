name: "Bug Report"
description: "Report a Better Bar issue"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for flagging something. Check existing issues first if you can.

  - type: textarea
    id: description
    attributes:
      label: What's wrong
      description: Describe the bug.
      placeholder: "When opening the media surface, ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How do you trigger it?
      placeholder: |
        1. Open Better Bar
        2. Press keybind ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Installation
      description: How did you install Better Bar?
      options:
        - "Omarchy Plugin"
        - "Standalone (Quickshell)"
    validations:
      required: true

  - type: textarea
    id: system_info
    attributes:
      label: System info
      description: Output of `hyprctl version`, `quickshell --version`, and your Linux distro.
      render: shell
      placeholder: |
        Hyprland: 0.44.0
        Quickshell: 0.3.1
        Distro: Arch Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output from `quickshell log` or terminal output.
      render: shell