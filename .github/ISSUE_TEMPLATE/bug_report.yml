name: "🐛 Bug Report"
description: "File a bug report to help improve Better Bar"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When opening the media surface, ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Better Bar
        2. Press keybind ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: How is Better Bar installed?
      options:
        - "Omarchy Plugin"
        - "Standalone (Quickshell)"
    validations:
      required: true

  - type: textarea
    id: system_info
    attributes:
      label: System Information
      description: Output of `hyprctl version`, `quickshell --version`, and Linux distribution.
      render: shell
      placeholder: |
        Hyprland: 0.44.0
        Quickshell: 0.3.1
        Distro: Arch Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Output from `quickshell log` or terminal output.
      render: shell
