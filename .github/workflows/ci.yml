name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python scripts syntax
        run: |
          python3 -m py_compile scripts/themes.py
          python3 -m py_compile scripts/wallcolors.py

      - name: Run Border Geometry Unit Tests
        run: node lib/border-geometry.test.mjs

      - name: Run Monitors Unit Tests
        run: node lib/monitors.test.mjs

      - name: Run Text Entry Unit Tests
        run: node --test lib/text-entry.test.mjs

      - name: Run Search Editing Tests
        run: node --test lib/search-editing.test.mjs

      - name: Run Media Pill Tests
        run: bash lib/media-pill.test.sh .

      - name: Run Plymouth Custom Tests
        run: bash lib/plymouth-custom.test.sh .

      - name: Run Plugins Surface Compact Tests
        run: bash lib/plugins-surface-compact.test.sh .

      - name: Run Plugin Service Facade Tests
        run: bash lib/plugin-service-facade.test.sh .

      - name: Run Ambient Aura Tests
        run: bash lib/ambient-aura.test.sh .

      - name: Run Settings Compact Tests
        run: bash lib/settings-compact.test.sh .

      - name: Run Strip Layout Tests
        run: bash lib/strip-layout.test.sh .

      - name: Run Uninstall Safe Tests
        run: bash lib/uninstall-safe.test.sh .

      - name: Run Recast Elapsed Tests
        run: bash lib/recast-elapsed.test.sh .

      - name: Run Recast Pill Exclusivity Tests
        run: bash lib/recast-pill-exclusive.test.sh .

      - name: Run Recast Truncated State Tests
        run: bash lib/recast-truncated-state.test.sh .

      - name: Run Search Field Input Tests
        run: bash lib/search-field-input.test.sh .

      - name: Run Bar Mutex Tests
        run: bash lib/bar-mutex.test.sh .

      - name: Run Bar Mutex Inheritance Tests
        run: bash lib/bar-mutex-inherit.test.sh .

      - name: Run Memory Trimmer Tests
        run: bash lib/memory-trimmer.test.sh .

      - name: Run GameMode Recast Integration Tests
        run: bash lib/gamemode-recast.test.sh .

      - name: Run Better Doctor Tests
        run: bash lib/better-doctor.test.sh .

      - name: Run Theme Parse Tests
        run: node --test lib/theme-parse.test.mjs

      - name: Run Wallpaper Single Click Tests
        run: bash lib/wallpaper-single-click.test.sh .

      - name: Run Wallpaper Search Unbound Var Tests
        run: bash lib/wallpaper-search-unbound.test.sh .

      - name: Run Wallpaper Map Symlink Tests
        run: bash lib/wallpaper-map-symlink.test.sh .

      - name: Run Theme Gallery Tests
        run: python3 lib/themes-gallery.test.py

      - name: Run Menu Speedtest Removal Tests
        run: bash lib/menu-speedtest-removed.test.sh

      - name: Run Wallpaper Theme Rescan Tests
        run: bash lib/wallpaper-theme-rescan.test.sh .

      - name: Run Fresh Install Smoke Tests
        run: bash lib/fresh-install-smoke.test.sh .

      - name: Run Wallpaper Tap Window Tests
        run: bash lib/wallpaper-tap-window.test.sh .

      - name: Run Wallpaper Multi Source Tests
        run: bash lib/wallpaper-multi-source.test.sh .

      - name: Run Wallpaper Multi Source Thumb Tests
        run: bash lib/wallpaper-multi-source-thumbs.test.sh .

      - name: Run Theme Dim Token Tests
        run: bash lib/theme-dim-token.test.sh .

      - name: Run Wallpaper Ownership Tests
        run: bash lib/wallpaper-owner.test.sh

      - name: Run Plaintext Wallpaper Tests
        run: bash lib/bt-plaintext.test.sh

      - name: Run Icon Alignment Tests
        run: bash lib/icon-alignment.test.sh

      - name: Run Surfaces Wiring Tests
        run: bash lib/surfaces-wired.test.sh

      - name: Run Theme Sync Tests
        run: bash lib/theme-sync.test.sh

      - name: Run Tray Behaviour Tests
        run: bash lib/tray-behaviour.test.sh

      - name: Run Update Guard Tests
        run: bash lib/update-guard.test.sh

      - name: Run Plaintext Wifi Tests
        run: bash lib/wifi-plaintext.test.sh

      - name: Run Screens Apply Tests
        run: bash lib/screens-apply.test.sh .

      - name: Run Screens Writer Tests
        run: bash lib/screens-writer.test.sh .

      - name: Run Screens Surface Tests
        run: bash lib/screens-surface.test.sh .

      - name: Run Screens Model Tests
        run: node lib/screens-model.test.mjs

      - name: Run Toast Layout Tests
        run: bash lib/toast-layout.test.sh .

      - name: Run Glass Transparency Tests
        run: bash lib/glass-transparency.test.sh .

      - name: Run Agent Pipeline Tests
        run: bash lib/agents.test.sh .

      - name: Run Agent State Machine Tests
        run: node lib/agents-state.test.mjs

      - name: Run OpenCode Reporter Tests
        run: node lib/opencode-agents.test.mjs

      - name: Run Plugin Update Check Tests
        run: bash lib/plugin-updates.test.sh .

      - name: Run Plugin Auto-Update Tests
        run: bash lib/plugin-autoupdate.test.sh .

      - name: Run Recast Countdown Tests
        run: bash lib/recast-countdown.test.sh .

      - name: Run Hyprland Glass Tests
        run: bash lib/hypr-glass.test.sh .

      - name: Run Theme Wallpaper Tests
        run: bash lib/theme-wallpaper.test.sh .

      - name: Run Search Focus Tests
        run: bash lib/search-focus.test.sh .

      - name: Run Settings Header Tests
        run: bash lib/settings-headers.test.sh .

      - name: Run Settings Row Handler Tests
        run: bash lib/settings-rows.test.sh .

      - name: Run Media Disc Tests
        run: bash lib/media-disc.test.sh .

      - name: Run Media Bud Tests
        run: bash lib/media-bud.test.sh .

      - name: Run Omarchy Guard Tests
        run: bash lib/omarchy-guard.test.sh .

      - name: Run Native Keybinds Tests
        run: bash lib/keybinds-surface.test.sh .

      - name: Run Settings Search Tests
        run: bash lib/settings-search.test.sh .

      - name: Run Keybinds Model Tests
        run: node --test lib/keybinds.test.mjs
