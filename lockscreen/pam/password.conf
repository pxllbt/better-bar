#%PAM-1.0
#
# Plain pam_unix, deliberately with no pam_faillock.
#
# faillock counts every failed auth against the account, and its lockout is
# independent of this process. That is fine for a TTY, and a serious hazard
# for a session lock: any attempt that dies before PAM reports a verdict
# (a SIGTERM, a crashed client, a suspended laptop) still burns an attempt.
# Three of those and the account is locked for minutes with no way to log
# in graphically, because the thing you need to fix it is the thing the
# lockout blocks. It happened during development -- three killed lock
# attempts locked the account out of its own lockscreen.
#
# pam_unix keeps its own retry limit inside a single pam_authenticate call,
# which is the part that actually protects the session lock.
auth    required                    pam_unix.so
